<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,maximum-scale=1">
<title>샤로수길 샵가능 빙고투어 — 이벤트 종료</title>
<meta name="description" content="샤로수길 샵가능 빙고투어가 종료되었습니다. 참여해주신 모든 분들께 감사드립니다.">
<meta property="og:title" content="샤로수길 샵가능 빙고투어 — 이벤트 종료">
<meta property="og:description" content="참여해주신 모든 분들께 진심으로 감사드립니다.">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<style>
@font-face{font-family:'Cafe24Ssurround';src:url('https://cdn.jsdelivr.net/gh/projectnoonnu/noonfonts_2004@1.1/Cafe24Ssurround.woff') format('woff');font-weight:normal;font-style:normal;font-display:swap}
:root{
  --blue:#4C7FDE; --deepgreen:#2E6B34; --chip:#DCE9C4; --chip-soft:#EFF4E3;
  --ink:#1B1B18; --gray:#6F6D5F; --paper:#F7F3E3; --bg:#CFDFB5;
  --clover:#3E8E4F; --gold:#F4E14E; --green:#57A24E;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  font-family:"Pretendard Variable",Pretendard,-apple-system,BlinkMacSystemFont,sans-serif;
  background:var(--bg); color:var(--ink);
  display:flex; justify-content:center;
  min-height:100svh; word-break:keep-all; line-height:1.6;
  padding:0 0 max(28px,env(safe-area-inset-bottom));
  -webkit-font-smoothing:antialiased;
}
.display{font-family:'Cafe24Ssurround','Pretendard Variable',sans-serif;font-weight:normal}
.wrap{width:100%;max-width:430px;padding:0 16px;display:flex;flex-direction:column;align-items:center}

/* 하단 "아래로 내려 게임 소개 보기" 안내는 종료 후 불필요하므로 크롭 */
.hero{position:relative;width:100%;margin-top:14px;border-radius:18px;overflow:hidden;aspect-ratio:840/1145}
.hero img{width:100%;display:block}
.hero::after{content:"";position:absolute;inset:0;background:rgba(27,27,24,.3)}
.seal{
  position:absolute; z-index:2; left:50%; top:50%;
  transform:translate(-50%,-50%) rotate(-11deg);
  width:clamp(146px,44vw,186px); aspect-ratio:1;
  border-radius:50%; background:var(--paper);
  border:3px solid var(--deepgreen);
  box-shadow:0 0 0 5px var(--paper),0 0 0 8px var(--deepgreen),0 10px 26px rgba(27,27,24,.3);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
  animation:seal .7s cubic-bezier(.2,1.5,.4,1) both;
}
@keyframes seal{from{opacity:0;transform:translate(-50%,-50%) rotate(-11deg) scale(1.5)}to{opacity:1;transform:translate(-50%,-50%) rotate(-11deg) scale(1)}}
.seal .en{font-size:10.5px;letter-spacing:2.4px;color:var(--clover);font-weight:900}
/* 브랜드 폰트를 유지하면서 획을 더 굵게 (Cafe24Ssurround는 단일 굵기) */
.seal .ko{
  font-size:clamp(27px,8.2vw,34px); color:var(--deepgreen);
  line-height:1.12; text-align:center; letter-spacing:-.5px;
  -webkit-text-stroke:2px var(--deepgreen);
  paint-order:stroke fill;
}
.seal .rule{width:52px;height:2px;background:var(--gold);border-radius:2px;margin:1px 0}

.card{
  width:100%; background:var(--paper); border:2px solid var(--ink);
  border-radius:20px; box-shadow:0 5px 0 var(--ink);
  margin-top:20px; padding:30px 22px 26px; text-align:center;
}
.badge{
  display:inline-block; background:var(--chip); color:var(--deepgreen);
  border:1.5px solid var(--deepgreen); border-radius:999px;
  font-size:11.5px; font-weight:800; letter-spacing:1.4px; padding:5px 13px; margin-bottom:15px;
}
.card h1{font-size:clamp(23px,6.6vw,27px);color:var(--deepgreen);line-height:1.34;margin-bottom:13px}
.card .lead{font-size:14.8px;color:var(--ink);font-weight:600}
.sep{display:flex;align-items:center;gap:9px;margin:21px 2px}
.sep i{flex:1;height:1.5px;background:var(--chip);border-radius:2px}
.sep span{font-size:14px;color:var(--clover)}
.card .thanks{font-size:13.8px;color:var(--gray);font-weight:500}
.card .thanks b{color:var(--deepgreen);font-weight:800}

.foot{margin-top:22px;text-align:center;font-size:11.5px;color:var(--gray);opacity:.8;padding-bottom:6px}
.foot .t{font-size:12.5px;color:var(--deepgreen);font-weight:800;margin-bottom:3px}

@media (max-width:360px){ .card{padding:26px 17px 23px} }
@media (prefers-reduced-motion:reduce){ .seal{animation:none} }
</style>
</head>
<body>
  <div class="wrap">

    <div class="hero">
      <img src="/assets/hero_final.svg" alt="샤로수길 샵가능 빙고투어">
      <div class="seal">
        <div class="en">EVENT CLOSED</div>
        <div class="rule"></div>
        <div class="ko display">이벤트<br>종료</div>
      </div>
    </div>

    <div class="card">
      <div class="badge">THANK YOU</div>
      <h1 class="display">즐거운 빙고투어,<br>여기서 마칩니다</h1>
      <p class="lead">샤로수길 샵가능 빙고투어에 참여해주신<br>모든 분들께 진심으로 감사드립니다.</p>

      <div class="sep"><i></i><span>🍀</span><i></i></div>

      <p class="thanks">
        여러분이 직접 걸어주신 골목과 채워주신 빙고 한 칸 한 칸이<br>
        <b>샤로수길을 더 특별하게</b> 만들어주었습니다.<br><br>
        함께해주셔서 고맙습니다.
      </p>
    </div>

    <div class="foot">
      <div class="t">샤로수길 샵가능 빙고투어</div>
      더 이상 이벤트에 참여하실 수 없습니다.
    </div>

  </div>
</body>
</html>
